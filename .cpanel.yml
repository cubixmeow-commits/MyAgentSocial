---
# Namecheap / cPanel Git Version Control deployment config.
# Deploy path: /home/iainmcok/public_html/myagent/
deployment:
  tasks:
    - export DEPLOYPATH=/home/iainmcok/public_html/myagent/
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/rsync -av --delete --exclude='.git' --exclude='.cpanel.yml' --exclude='.well-known' --exclude='relay.sqlite' --exclude='relay.sqlite-*' --exclude='config.php' --filter='protect config.php' --filter='protect relay.sqlite' --filter='protect relay.sqlite-*' ./ $DEPLOYPATH
